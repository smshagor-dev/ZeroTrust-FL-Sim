services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZTFL_POSTGRES_USER:-ztfl}
      POSTGRES_DB: ${ZTFL_POSTGRES_DB:-zerotrust_fl}
      POSTGRES_PASSWORD: ${ZTFL_POSTGRES_PASSWORD:?set ZTFL_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - control-plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  coordinator:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZTFL_STATE_FILE: ""
      ZTFL_POSTGRES_DSN: ${ZTFL_POSTGRES_DSN:?set ZTFL_POSTGRES_DSN}

volumes:
  postgres_data:
