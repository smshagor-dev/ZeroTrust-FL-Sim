name: Bug report
description: Report a reproducible defect in ZeroTrust-FL-Sim
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets or private vulnerability details here. Security vulnerabilities must follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Commit / version
      description: Exact commit SHA, tag, or package version.
      placeholder: e.g. main @ abc1234 or 0.4.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Python/PyTorch/Go/compiler/CMake/CUDA versions as relevant.
      placeholder: Paste the relevant environment details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic reproduction you can.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / traceback
      description: Remove credentials, keys, tokens, personal data, and unrelated sensitive information.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Include dataset/seed/attack/aggregator/privacy/PQC/backend configuration when relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not disclose a security vulnerability publicly.
          required: true
