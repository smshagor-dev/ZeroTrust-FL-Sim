name: Frontend Dashboard

on:
  pull_request:
    paths:
      - "frontend/**"
      - "main.py"
      - "scripts/run_master_training.py"
      - ".github/workflows/frontend-dashboard.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "main.py"
      - "scripts/run_master_training.py"
      - ".github/workflows/frontend-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: frontend-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck dashboard
        working-directory: frontend
        run: npm run typecheck
      - name: Build dashboard
        working-directory: frontend
        run: npm run build
      - name: Compile one-command dashboard integration
        run: python -m py_compile main.py scripts/run_master_training.py
      - name: Smoke master CLI
        run: python main.py --help > /dev/null
