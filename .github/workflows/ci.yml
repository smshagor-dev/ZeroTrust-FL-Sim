name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go security and coordinator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Generate Go protobuf code
        run: make proto
      - name: Hydrate Go module checksums
        run: go mod tidy
      - name: Format Go
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go'
      - name: Vet Go
        run: go vet ./...
      - name: Test Go
        run: go test -v ./... -count=1

  postgres-state:
    name: PostgreSQL durable state
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ztfl
          POSTGRES_PASSWORD: ztfl-ci-only
          POSTGRES_DB: ztfl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ztfl -d ztfl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ZTFL_TEST_POSTGRES_DSN: postgres://ztfl:ztfl-ci-only@127.0.0.1:5432/ztfl?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Generate Go protobuf code
        run: make proto
      - name: Hydrate Go module checksums
        run: go mod tidy
      - name: Test PostgreSQL state migrations and recovery
        run: go test -v ./pkg/coordinator -run PostgresStateStore -count=1

  python-native:
    name: Python and C++20 native extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 git
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
      - name: Generate Python protobuf code
        run: python scripts/generate_python_proto.py
      - name: Build native extension
        env:
          CC: gcc-12
          CXX: g++-12
          ZTFL_NATIVE_ARCH: 'OFF'
          ZTFL_ENABLE_OPENMP: 'ON'
          ZTFL_ENABLE_CKKS: 'ON'
          ZTFL_ENABLE_CUDA: 'OFF'
        run: python -m pip install -e .
      - name: Test privacy and CKKS path
        run: python -m pytest -q tests/test_privacy.py
      - name: Test resilience and observability path
        run: python -m pytest -q tests/test_observability.py
      - name: Verify native module features
        run: >-
          python -c "import zerotrust_fl_cpp as native;
          print('version:', native.__version__);
          print('OpenMP:', native.openmp_enabled);
          print('SIMD:', native.simd_backend);
          print('CKKS:', native.ckks_enabled);
          print('CUDA:', native.cuda_enabled);
          assert native.ckks_enabled;
          assert native.simd_backend in {'scalar', 'avx512', 'neon'};
          assert not native.cuda_enabled"
      - name: Lint Python
        run: ruff check fl scripts tests benchmarks --exclude 'fl/zerotrust_fl/protocols/fl_service_pb2*.py'
      - name: Test Python and native extension
        run: python -m pytest -q --cov=zerotrust_fl --cov-report=term-missing --cov-report=xml

  integration:
    name: Docker integration and benchmark smoke
    runs-on: ubuntu-latest
    needs: [go, postgres-state, python-native]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate resilience overlays
        run: |
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.chaos.yml config >/dev/null
          ZTFL_POSTGRES_PASSWORD=ci-only \
          ZTFL_POSTGRES_DSN='postgres://ztfl:ci-only@postgres:5432/zerotrust_fl?sslmode=disable' \
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml config >/dev/null
      - name: Prepare benchmark output
        run: |
          mkdir -p benchmarks/results
          chmod 0777 benchmarks/results
      - name: Build testbed images
        run: docker compose build --pull
      - name: Start zero-trust cluster
        run: docker compose up -d --wait --wait-timeout 240
      - name: Inspect cluster
        run: docker compose ps
      - name: Verify durable coordinator restart recovery
        run: |
          wait_healthy() {
            service="$1"
            container_id="$(docker compose ps -q "$service")"
            if [ -z "$container_id" ]; then
              echo "service $service has no running container" >&2
              return 1
            fi
            for _ in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
              case "$status" in
                healthy|running)
                  return 0
                  ;;
                unhealthy|exited|dead)
                  echo "service $service entered terminal state: $status" >&2
                  docker compose logs --no-color "$service" >&2 || true
                  return 1
                  ;;
              esac
              sleep 2
            done
            echo "service $service did not become healthy" >&2
            docker compose logs --no-color "$service" >&2 || true
            return 1
          }

          STATE_PATH=/var/lib/zerotrust-fl/coordinator-state.json
          docker compose exec -T coordinator test -s "$STATE_PATH"
          PKI_BEFORE="$(docker compose exec -T coordinator sha256sum /certs/ca.crt /certs/server.crt /certs/jwt_signing_public.pem)"
          docker compose stop benign-worker-1 benign-worker-2 benign-worker-3 malicious-worker-1
          docker compose cp "coordinator:$STATE_PATH" /tmp/coordinator-state-before.json
          docker compose restart coordinator
          wait_healthy coordinator
          PKI_AFTER="$(docker compose exec -T coordinator sha256sum /certs/ca.crt /certs/server.crt /certs/jwt_signing_public.pem)"
          test "$PKI_BEFORE" = "$PKI_AFTER"
          docker compose cp "coordinator:$STATE_PATH" /tmp/coordinator-state-after.json
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path("/tmp/coordinator-state-before.json").read_text())
          after = json.loads(Path("/tmp/coordinator-state-after.json").read_text())
          for key in ("schema_version", "policy", "model_proto", "pending_updates"):
              if before.get(key) != after.get(key):
                  raise SystemExit(f"durable coordinator restart changed {key}")
          PY
          for service in benign-worker-1 benign-worker-2 benign-worker-3 malicious-worker-1; do
            container_id="$(docker compose ps -aq "$service")"
            if [ -z "$container_id" ]; then
              echo "service $service has no existing container" >&2
              exit 1
            fi
            docker start "$container_id"
          done
          for service in benign-worker-1 benign-worker-2 benign-worker-3 malicious-worker-1; do
            wait_healthy "$service"
          done
          PKI_AFTER_WORKERS="$(docker compose exec -T coordinator sha256sum /certs/ca.crt /certs/server.crt /certs/jwt_signing_public.pem)"
          test "$PKI_BEFORE" = "$PKI_AFTER_WORKERS"
      - name: Run benchmark smoke suite
        run: >-
          docker compose run --rm --no-deps --entrypoint python benign-worker-1
          /app/benchmarks/benchmark_suite.py
          --profile quick
          --sections aggregation network convergence
          --output-dir /app/benchmarks/results
      - name: List benchmark outputs
        run: find benchmarks/results -maxdepth 1 -type f -print -exec ls -lh {} \;
      - name: Upload benchmark plots and data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 14
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log || true
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-logs-${{ github.run_id }}
          path: docker-compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop testbed
        if: always()
        run: docker compose down -v --remove-orphans
