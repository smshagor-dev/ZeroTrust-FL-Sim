name: CYSE-01608 UNSW-NB15 real heldout benchmark

on:
  push:
    branches:
      - research/cyse-01608-reproducibility
    paths:
      - "research/cyse_01608/unsw_*.py"
      - "research/cyse_01608/tests/test_unsw_data.py"
      - ".github/workflows/cyse-unsw-nb15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsw-nb15-heldout:
    name: Verified UNSW-NB15 heldout FL intrusion detection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use pinned Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install standalone reproducibility dependencies
        run: python -m pip install -r research/cyse_01608/requirements.txt
      - name: Validate UNSW ingestion and experiment tests with synthetic fixtures
        run: python -m pytest -q research/cyse_01608/tests/test_unsw_data.py research/cyse_01608/tests/test_unsw_interaction.py
      - name: Download independent public mirror of UNSW academic-use split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/unsw_nb15
          base="https://raw.githubusercontent.com/Nir-J/ML-Projects/44bbd02b9e70f74dd915218d5eb702f125341ffc/UNSW-Network_Packet_Classification"
          curl -fL --retry 3 --connect-timeout 30 -o data/unsw_nb15/UNSW_NB15_training-set.csv "$base/UNSW_NB15_training-set.csv"
          curl -fL --retry 3 --connect-timeout 30 -o data/unsw_nb15/UNSW_NB15_testing-set.csv "$base/UNSW_NB15_testing-set.csv"
      - name: Validate both downloaded files against pinned Git content SHA
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "research/cyse_01608")
          from unsw_data import EXPECTED_GIT_BLOBS, verify_file
          root = Path("data/unsw_nb15")
          for name, file in (("train", "UNSW_NB15_training-set.csv"), ("test", "UNSW_NB15_testing-set.csv")):
              meta = verify_file(root/file, EXPECTED_GIT_BLOBS[name])
              print(name, meta["sha256"], meta["size_bytes"])
          PY
      - name: Run 5-seed official-heldout privacy/Byzantine evaluation
        run: |
          python research/cyse_01608/unsw_experiment.py \
            --train data/unsw_nb15/UNSW_NB15_training-set.csv \
            --test data/unsw_nb15/UNSW_NB15_testing-set.csv \
            --output artifacts/cyse_01608_unsw_nb15 \
            --seeds 0 1 2 3 4 \
            --aggregators mean multi_krum \
            --privacy-modes clip_only dp_1 \
            --attacker-compliance compliant bypass \
            --attacks sign_flip \
            --rounds 20 \
            --malicious-clients 3 \
            --partition dirichlet --alpha 0.3 \
            --train-limit 6000 --test-limit 3000
          python - <<'PY'
          import csv,json
          from pathlib import Path
          folder=Path("artifacts/cyse_01608_unsw_nb15")
          meta=json.loads((folder/"unsw_manifest.json").read_text())
          assert meta["federated_executions"] == 80
          assert meta["federated_rounds"] == 1600
          assert meta["dataset_manifests"][0]["sampled_train"] == 6000
          assert meta["dataset_manifests"][0]["sampled_test"] == 3000
          with (folder/"unsw_runs.csv").open(newline="") as f: runs=list(csv.DictReader(f))
          with (folder/"unsw_paired.csv").open(newline="") as f: paired=list(csv.DictReader(f))
          assert len(runs)==80 and len(paired)==40
          print("Verified UNSW heldout",len(runs),"runs, ",len(paired),"matched attack pairs")
          PY
      - name: Analyze pre-specified privacy-by-bypass-by-aggregator interaction
        run: |
          python research/cyse_01608/unsw_interaction.py --input artifacts/cyse_01608_unsw_nb15/unsw_paired.csv --output artifacts/cyse_01608_unsw_nb15/unsw_interaction.csv --draws 10000
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path("artifacts/cyse_01608_unsw_nb15")
          with (root/"unsw_interaction.csv").open(newline="") as f: rows=list(csv.DictReader(f))
          manifest=json.loads((root/"unsw_interaction_manifest.json").read_text())
          assert len(rows)==9 and manifest["comparisons"]==9
          assert all(int(row["seeds"])==5 for row in rows)
          assert manifest["primary_contrast"]=="accuracy_drop_pp / multi_krum_minus_mean"
          PY
      - name: Publish reproducibility outputs only; never redistribute copyrighted dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyse-01608-unsw-nb15-heldout-evidence
          path: artifacts/cyse_01608_unsw_nb15/
          if-no-files-found: ignore
          retention-days: 30
