name: CYSE-01608 independent reproducibility

on:
  push:
    paths:
      - "research/cyse_01608/**"
      - ".github/workflows/cyse-01608.yml"
  pull_request:
    paths:
      - "research/cyse_01608/**"
      - ".github/workflows/cyse-01608.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reference-study:
    name: Regression tests and 720-condition matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned standalone study dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/cyse_01608/requirements.txt
      - name: Run research regression tests
        run: python -m pytest -q research/cyse_01608/tests
      - name: Execute complete independent 720-condition reference matrix
        run: |
          python research/cyse_01608/reproduce.py --output artifacts/cyse_01608
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path("artifacts/cyse_01608")
          manifest = json.loads((p / "manifest.json").read_text())
          with (p / "runs.csv").open(newline="") as f:
              n = sum(1 for _ in csv.DictReader(f))
          assert n == 720, n
          assert manifest["run_count"] == 720
          assert manifest["total_rounds"] == 14400
          print(f"Verified independent matrix: {n} runs / {manifest['total_rounds']} rounds")
          PY
      - name: Execute malicious-client protocol-bypass extension
        run: |
          python research/cyse_01608/reproduce.py --output artifacts/cyse_01608_bypass --attacker-compliance bypass --aggregators mean median multi_krum --privacy-modes clip_only dp_1 dp_2 --threats benign sign_flip
          python research/cyse_01608/security_analysis.py --compliant artifacts/cyse_01608/paired.csv --bypass artifacts/cyse_01608_bypass/paired.csv --output artifacts/cyse_01608_bypass/security_comparison.csv
      - name: Execute non-IID extension (not part of submitted matrix)
        run: |
          python research/cyse_01608/reproduce.py --output artifacts/cyse_01608_non_iid --partition dirichlet --alpha 0.3 --aggregators mean median multi_krum --privacy-modes clip_only dp_1 --threats benign sign_flip
      - name: Execute crossed security sensitivity smoke grid
        run: |
          python research/cyse_01608/stress_matrix.py --output artifacts/cyse_01608_stress --datasets breast_cancer digits --seeds 0 1 --partitions iid dirichlet --alphas 0.3 --malicious-clients 1 3 --aggregators mean median --privacy-modes clip_only dp_1 --threats sign_flip --attacker-compliance compliant bypass --rounds 5
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("artifacts/cyse_01608_stress/stress_manifest.json").read_text())
          assert m["scenarios"] == 128
          assert m["executed_runs"] == 256
          assert m["total_rounds"] == 1280
          PY
      - name: Analyze paired crossed sensitivity with Holm correction
        run: |
          python research/cyse_01608/stress_inference.py --inputs artifacts/cyse_01608_stress/stress_pairs.csv --output artifacts/cyse_01608_stress/stress_inference.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path("artifacts/cyse_01608_stress/stress_inference.csv").open() as stream:
              findings = list(csv.DictReader(stream))
          assert len(findings) == 16
          assert all(int(r["observations"]) == 4 for r in findings)
          PY
      - name: Execute ALIE statistics-oracle adversarial reference
        run: |
          python research/cyse_01608/reproduce.py --output artifacts/cyse_01608_alie --datasets breast_cancer --seeds 0 1 --aggregators median multi_krum --privacy-modes dp_1 --threats benign alie_oracle --attacker-compliance bypass
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("artifacts/cyse_01608_alie/manifest.json").read_text())
          assert m["run_count"] == 8
          assert m["total_rounds"] == 160
          PY
      - name: Execute RQ2 Multi-Krum oracle admission diagnostic
        run: |
          python research/cyse_01608/selection_experiment.py --output artifacts/cyse_01608_selection --datasets breast_cancer digits --seeds 0 1 --partitions iid dirichlet --alphas 0.3 --malicious-clients 3 --privacy-modes clip_only dp_1 --attacker-compliance compliant bypass --rounds 5
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path("artifacts/cyse_01608_selection")
          m = json.loads((p / "selection_manifest.json").read_text())
          assert m["runs"] == 32
          assert m["total_rounds"] == 160
          with (p / "selection_runs.csv").open(newline="") as s:
              rows = list(csv.DictReader(s))
          assert len(rows) == 32
          assert all(0.0 <= float(r["selected_malicious_fraction"]) <= 1.0 for r in rows)
          PY
      - name: Verify paired RQ2 admission inference
        run: |
          python research/cyse_01608/selection_inference.py --input artifacts/cyse_01608_selection/selection_runs.csv --output artifacts/cyse_01608_selection/selection_inference.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path("artifacts/cyse_01608_selection/selection_inference.csv").open(newline="") as stream:
              rows=list(csv.DictReader(stream))
          assert len(rows)==4
          assert all(int(row["dataset_seed_pairs"])==4 for row in rows)
          PY
      - name: Upload independent results (not original manuscript data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyse-01608-independent-reference
          path: |
            artifacts/cyse_01608/
            artifacts/cyse_01608_bypass/
            artifacts/cyse_01608_non_iid/
            artifacts/cyse_01608_stress/
            artifacts/cyse_01608_alie/
            artifacts/cyse_01608_selection/
          if-no-files-found: ignore
          retention-days: 30
