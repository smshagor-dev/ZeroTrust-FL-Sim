name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-dependencies:
    name: Source, dependency, license, workflow, and secret gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Generate Go protobuf code
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          make proto
          go mod tidy
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - name: Enforce reviewed direct-dependency licenses
        run: python scripts/check_runtime_licenses.py
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pip-audit>=2.9,<3'
          pip-audit -r requirements.txt --strict --progress-spinner=off
      - name: Audit Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Run Go SAST
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -exclude-generated -severity high -confidence high ./...
      - name: Audit dashboard runtime dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Run Python SAST
        run: |
          python -m pip install --disable-pip-version-check 'bandit>=1.8,<2'
          bandit -r fl scripts benchmarks -x fl/zerotrust_fl/protocols -lll -iii
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    name: Parser and native sanitizer fuzz gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install protobuf compiler and native fuzz compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang
      - name: Generate Go protobuf code
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          make proto
          go mod tidy
      - name: Fuzz Go NumPy model decoder
        run: go test ./pkg/coordinator -run=^$ -fuzz=FuzzDecodeNPYFloat32 -fuzztime=20s
      - name: Build native Byzantine fuzz target with sanitizers
        run: |
          clang++ \
            -std=c++20 \
            -O1 \
            -g \
            -fno-omit-frame-pointer \
            -fsanitize=fuzzer,address,undefined \
            -Icpp/include \
            cpp/fuzz/byzantine_aggregator_fuzz.cpp \
            cpp/src/byzantine_aggregator.cpp \
            cpp/src/simd_distance.cpp \
            -o /tmp/ztfl-byzantine-fuzz
      - name: Fuzz native Byzantine aggregation boundary
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/ztfl-byzantine-fuzz -max_total_time=20 -timeout=5 -rss_limit_mb=2048 -max_len=4096

  container-vulnerability:
    name: Container vulnerability gate (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [coordinator, worker, recovery]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build production image
        run: docker build --pull -f "docker/Dockerfile.${{ matrix.component }}" -t "ztfl-${{ matrix.component }}:security" .
      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ztfl-${{ matrix.component }}:security
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
