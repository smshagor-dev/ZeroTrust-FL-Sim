name: CYSE-01608 Cross-dataset privacy and Byzantine analysis

on:
  push:
    branches:
      - research/cyse-01608-reproducibility
    paths:
      - "research/cyse_01608/cross_dataset_compare.py"
      - "research/cyse_01608/tests/test_cross_dataset_compare.py"
      - "research/cyse_01608/nsl_*.py"
      - "research/cyse_01608/unsw_*.py"
      - ".github/workflows/cyse-cross-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    name: Reproduce both historical benchmarks from verified sources
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Pin Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned study dependencies
        run: python -m pip install -r research/cyse_01608/requirements.txt
      - name: Validate source processing and source-isolated comparison
        run: |
          python -m pytest -q research/cyse_01608/tests/test_nsl_data.py research/cyse_01608/tests/test_unsw_data.py research/cyse_01608/tests/test_cross_dataset_compare.py
      - name: Download four independently pinned historical source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/unsw data/nsl
          unsw="https://raw.githubusercontent.com/Nir-J/ML-Projects/44bbd02b9e70f74dd915218d5eb702f125341ffc/UNSW-Network_Packet_Classification"
          nsl="https://raw.githubusercontent.com/Jehuty4949/NSL_KDD/27bbbdf5c5cccf9970b8b6037a0f19dc09c5a0a9"
          curl -fL --retry 3 --connect-timeout 30 -o data/unsw/UNSW_NB15_training-set.csv "$unsw/UNSW_NB15_training-set.csv"
          curl -fL --retry 3 --connect-timeout 30 -o data/unsw/UNSW_NB15_testing-set.csv "$unsw/UNSW_NB15_testing-set.csv"
          curl -fL --retry 3 --connect-timeout 30 -o data/nsl/KDDTrain+.txt "$nsl/KDDTrain%2B.txt"
          curl -fL --retry 3 --connect-timeout 30 -o data/nsl/KDDTest+.txt "$nsl/KDDTest%2B.txt"
      - name: Verify source hashes before any research simulation
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"research/cyse_01608")
          import unsw_data,nsl_data
          for name,path,blob in [
              ("unsw_train",Path("data/unsw/UNSW_NB15_training-set.csv"),unsw_data.EXPECTED_GIT_BLOBS["train"]),
              ("unsw_test",Path("data/unsw/UNSW_NB15_testing-set.csv"),unsw_data.EXPECTED_GIT_BLOBS["test"]),
              ("nsl_train",Path("data/nsl/KDDTrain+.txt"),nsl_data.EXPECTED_GIT_BLOBS["train"]),
              ("nsl_test",Path("data/nsl/KDDTest+.txt"),nsl_data.EXPECTED_GIT_BLOBS["test"]),
          ]:
              print(name,unsw_data.verify_file(path,blob)["sha256"])
          PY
      - name: Re-execute five-seed UNSW-NB15 held-out benchmark
        run: |
          python research/cyse_01608/unsw_experiment.py \
            --train data/unsw/UNSW_NB15_training-set.csv \
            --test data/unsw/UNSW_NB15_testing-set.csv \
            --output evidence/unsw --seeds 0 1 2 3 4 \
            --aggregators mean multi_krum \
            --privacy-modes clip_only dp_1 \
            --attacker-compliance compliant bypass \
            --attacks sign_flip --rounds 20 --malicious-clients 3 \
            --partition dirichlet --alpha 0.3 \
            --train-limit 6000 --test-limit 3000
      - name: Re-execute five-seed NSL-KDD held-out benchmark
        run: |
          python research/cyse_01608/nsl_experiment.py \
            --train data/nsl/KDDTrain+.txt \
            --test data/nsl/KDDTest+.txt \
            --output evidence/nsl --seeds 0 1 2 3 4 \
            --aggregators mean multi_krum \
            --privacy-modes clip_only dp_1 \
            --attacker-compliance compliant bypass \
            --attacks sign_flip --rounds 20 --malicious-clients 3 \
            --partition dirichlet --alpha 0.3 \
            --train-limit 6000 --test-limit 3000
      - name: Verify each benchmark's own manifest, hashes and paired grid
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          for dirname,stem,label in (("unsw","unsw","UNSW-NB15"),("nsl","nsl","NSL-KDD")):
              root=Path("evidence")/dirname
              manifest=json.loads((root/(stem+"_manifest.json")).read_text())
              assert manifest["federated_executions"]==80
              assert manifest["federated_rounds"]==1600
              assert len(manifest["dataset_manifests"])==5
              assert all(m["sampled_train"]==6000 and m["sampled_test"]==3000
                         for m in manifest["dataset_manifests"])
              with (root/(stem+"_runs.csv")).open(newline="") as f: runs=list(csv.DictReader(f))
              with (root/(stem+"_paired.csv")).open(newline="") as f: pairs=list(csv.DictReader(f))
              assert len(runs)==80 and len(pairs)==40
              assert {r["dataset"] for r in runs}=={label}
              assert hashlib.sha256((root/(stem+"_runs.csv")).read_bytes()).hexdigest()==manifest["runs_sha256"]
              print(label, "80 runs, 40 pairs, SHA-256 verified")
          PY
      - name: Compute source-separated triple interactions without pooled p-values
        run: |
          python research/cyse_01608/cross_dataset_compare.py \
            --unsw-paired evidence/unsw/unsw_paired.csv \
            --nsl-paired evidence/nsl/nsl_paired.csv \
            --output artifacts/cyse_01608_cross_dataset \
            --draws 10000
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("artifacts/cyse_01608_cross_dataset")
          with (p/"cross_seed_effects.csv").open(newline="") as f: effects=list(csv.DictReader(f))
          with (p/"cross_summary.csv").open(newline="") as f: summary=list(csv.DictReader(f))
          manifest=json.loads((p/"cross_manifest.json").read_text())
          assert len(effects)==30 and len(summary)==9
          assert manifest["seed_effects"]==30 and manifest["summary_rows"]==9
          assert {r["dataset"] for r in effects}=={"UNSW-NB15","NSL-KDD"}
          print("Cross-dataset experiment reproduced directly from pinned source files")
          PY
      - name: Archive all newly generated experiment outputs, never raw third-party datasets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyse-01608-self-contained-two-source-reproduction
          path: |
            evidence/unsw/unsw_runs.csv
            evidence/unsw/unsw_paired.csv
            evidence/unsw/unsw_manifest.json
            evidence/nsl/nsl_runs.csv
            evidence/nsl/nsl_paired.csv
            evidence/nsl/nsl_manifest.json
            artifacts/cyse_01608_cross_dataset/
          if-no-files-found: ignore
          retention-days: 30
