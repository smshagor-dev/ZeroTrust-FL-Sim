name: CYSE-01608 Robust plaintext baseline comparison

on:
  push:
    branches: [research/cyse-01608-reproducibility]
    paths:
      - "research/cyse_01608/robust_baselines.py"
      - "research/cyse_01608/defense_benchmark.py"
      - "research/cyse_01608/reproduce.py"
      - "research/cyse_01608/tests/test_robust_baselines.py"
      - "research/cyse_01608/tests/test_defense_benchmark.py"
      - ".github/workflows/cyse-robust-baselines.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: UNSW-NB15
            slug: unsw
          - dataset: NSL-KDD
            slug: nsl
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned numerical research dependencies
        run: python -m pip install -r research/cyse_01608/requirements.txt
      - name: Validate existing 720-grid invariance and RFA/server-gate tests
        run: |
          python -m pytest -q research/cyse_01608/tests/test_robust_baselines.py research/cyse_01608/tests/test_defense_benchmark.py research/cyse_01608/tests/test_reproduce.py
      - name: Download pinned original-split CSVs without redistributing source data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/input
          if [[ "${{ matrix.slug }}" == "unsw" ]]; then
            base="https://raw.githubusercontent.com/Nir-J/ML-Projects/44bbd02b9e70f74dd915218d5eb702f125341ffc/UNSW-Network_Packet_Classification"
            curl -fL --retry 3 -o data/input/train "$base/UNSW_NB15_training-set.csv"
            curl -fL --retry 3 -o data/input/test "$base/UNSW_NB15_testing-set.csv"
          else
            base="https://raw.githubusercontent.com/Jehuty4949/NSL_KDD/27bbbdf5c5cccf9970b8b6037a0f19dc09c5a0a9"
            curl -fL --retry 3 -o data/input/train "$base/KDDTrain%2B.txt"
            curl -fL --retry 3 -o data/input/test "$base/KDDTest%2B.txt"
          fi
      - name: Run five-seed sign-flip with six established or norm-gated baselines
        run: |
          python research/cyse_01608/defense_benchmark.py \
            --dataset "${{ matrix.dataset }}" \
            --train data/input/train --test data/input/test \
            --output artifacts/cyse_01608_baselines_${{ matrix.slug }} \
            --seeds 0 1 2 3 4 \
            --methods mean multi_krum rfa server_clipped_mean server_clipped_rfa server_clipped_multi_krum \
            --privacy clip_only dp_1 \
            --policies compliant bypass \
            --attacks sign_flip \
            --rounds 20 --train-limit 6000 --test-limit 3000
      - name: Verify all 240 runs, source checksums and original-grid exclusion
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          path=Path("artifacts/cyse_01608_baselines_${{ matrix.slug }}")
          manifest=json.loads((path/"baseline_manifest.json").read_text())
          assert manifest["not_original_720_runs"] is True
          assert manifest["executions"]==240
          assert manifest["federated_rounds"]==4800
          assert len(manifest["dataset_split_manifests"])==5
          with (path/"baseline_runs.csv").open(newline="") as f: runs=list(csv.DictReader(f))
          with (path/"baseline_pairs.csv").open(newline="") as f: pairs=list(csv.DictReader(f))
          with (path/"baseline_summary.csv").open(newline="") as f: summaries=list(csv.DictReader(f))
          assert len(runs)==240 and len(pairs)==120 and len(summaries)==24
          assert hashlib.sha256((path/"baseline_runs.csv").read_bytes()).hexdigest()==manifest["raw_csv_sha256"]
          assert hashlib.sha256((path/"baseline_pairs.csv").read_bytes()).hexdigest()==manifest["paired_csv_sha256"]
          assert all(0<=float(r["macro_f1"])<=1 for r in runs)
          print("Verified 240 baseline conditions / 4800 rounds:",manifest["dataset"])
          PY
      - name: Archive machine-readable results and manifests (not copyrighted raw dataset)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyse-01608-plaintext-robust-baselines-${{ matrix.slug }}
          path: artifacts/cyse_01608_baselines_${{ matrix.slug }}/
          if-no-files-found: ignore
          retention-days: 30
