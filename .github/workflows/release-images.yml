name: Release OCI Images

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write
  issues: read

concurrency:
  group: release-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Publish signed release artifacts and immutable OCI digests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tracked production release contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          python scripts/validate_v1_release.py --mode publish
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"
      - name: Validate exact v1 release commit workflows
        if: github.ref_name == 'v1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for workflow in "CI" "Security" "Deployment Validation" "Release Evidence"; do
            conclusion="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="$RELEASE_COMMIT" \
              -f per_page=100 \
              --jq ".workflow_runs | map(select(.name == \"${workflow}\" and .status == \"completed\")) | sort_by(.run_number) | last | .conclusion // \"missing\"")"
            if [ "$conclusion" != success ]; then
              echo "exact release commit workflow ${workflow} is not green: ${conclusion}" >&2
              exit 1
            fi
          done
      - name: Validate live v1 assurance dispositions
        if: github.ref_name == 'v1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/v1-assurance-gates.tsv
          import json
          from pathlib import Path

          evidence = json.loads(Path("release/v1.0-evidence.json").read_text(encoding="utf-8"))
          for gate in evidence["hard_gates"].values():
              if gate["satisfied"] and not gate["waived"]:
                  expected_reason = "completed"
              elif gate["waived"] and not gate["satisfied"]:
                  expected_reason = "not_planned"
              else:
                  raise SystemExit(f"invalid assurance disposition for issue #{gate['issue']}")
              print(f"{gate['issue']}\t{expected_reason}")
          PY
          while IFS=$'\t' read -r issue expected_reason; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" --jq .state)"
            reason="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" --jq '.state_reason // ""')"
            if [ "$state" != closed ] || [ "$reason" != "$expected_reason" ]; then
              echo "v1.0.0 assurance issue #${issue} has wrong live disposition: state=${state} reason=${reason} expected=${expected_reason}" >&2
              exit 1
            fi
          done < /tmp/v1-assurance-gates.tsv
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Configure buildx
        run: docker buildx create --name ztfl-release --use --driver docker-container
      - name: Build and push release images
        id: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          : > release-metadata/image-digests.txt
          for component in coordinator worker recovery; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zerotrust-fl-sim-${component}"
            docker buildx build \
              --pull \
              --platform linux/amd64 \
              --file "docker/Dockerfile.${component}" \
              --tag "${image}:${VERSION}" \
              --push \
              --metadata-file "release-metadata/${component}.json" \
              .
            digest="$(python -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")).get("containerimage.digest"); assert isinstance(value,str) and value.startswith("sha256:"); print(value)' "release-metadata/${component}.json")"
            printf '%s@%s\n' "${image}" "${digest}" >> release-metadata/image-digests.txt
            printf '%s_image=%s\n' "${component}" "${image}" >> "$GITHUB_OUTPUT"
            printf '%s_digest=%s\n' "${component}" "${digest}" >> "$GITHUB_OUTPUT"
          done
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / Cosign 3.0.6

      - name: Build deterministic source release archive
        id: source
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="release-metadata/ZeroTrust-FL-Sim-${VERSION}-source.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="ZeroTrust-FL-Sim-${VERSION}/" \
            --output="$archive" \
            "$GITHUB_SHA"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - name: Generate source SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-metadata/source.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Keyless-sign source release archive
        run: >-
          cosign sign-blob --yes
          --bundle release-metadata/source.sigstore.json
          "${{ steps.source.outputs.archive }}"
      - name: Attest source release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.source.outputs.archive }}

      - name: Generate coordinator SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.build.outputs.coordinator_image }}@${{ steps.build.outputs.coordinator_digest }}
          format: spdx-json
          output-file: release-metadata/coordinator.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Generate worker SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.build.outputs.worker_image }}@${{ steps.build.outputs.worker_digest }}
          format: spdx-json
          output-file: release-metadata/worker.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Generate recovery SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.build.outputs.recovery_image }}@${{ steps.build.outputs.recovery_digest }}
          format: spdx-json
          output-file: release-metadata/recovery.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false

      - name: Keyless-sign immutable image digests and attach SBOM attestations
        run: |
          set -euo pipefail
          for component in coordinator worker recovery; do
            image="${{ steps.build.outputs.coordinator_image }}"
            digest="${{ steps.build.outputs.coordinator_digest }}"
            if [ "$component" = worker ]; then
              image="${{ steps.build.outputs.worker_image }}"
              digest="${{ steps.build.outputs.worker_digest }}"
            elif [ "$component" = recovery ]; then
              image="${{ steps.build.outputs.recovery_image }}"
              digest="${{ steps.build.outputs.recovery_digest }}"
            fi
            ref="${image}@${digest}"
            cosign sign --yes "$ref"
            cosign attest --yes --type https://spdx.dev/Document --predicate "release-metadata/${component}.spdx.json" "$ref"
          done

      - name: Attest coordinator build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.coordinator_image }}
          subject-digest: ${{ steps.build.outputs.coordinator_digest }}
          push-to-registry: true
      - name: Attest worker build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.worker_image }}
          subject-digest: ${{ steps.build.outputs.worker_digest }}
          push-to-registry: true
      - name: Attest recovery build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.recovery_image }}
          subject-digest: ${{ steps.build.outputs.recovery_digest }}
          push-to-registry: true

      - name: Record release evidence checksums
        run: |
          set -euo pipefail
          sha256sum \
            release-metadata/image-digests.txt \
            release-metadata/ZeroTrust-FL-Sim-${{ github.ref_name }}-source.tar.gz \
            release-metadata/source.spdx.json \
            release-metadata/source.sigstore.json \
            release-metadata/coordinator.spdx.json \
            release-metadata/worker.spdx.json \
            release-metadata/recovery.spdx.json \
            > release-metadata/SHA256SUMS
      - name: Prepare GitHub release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${VERSION}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-metadata/release-notes.md
          else
            printf '# ZeroTrust-FL-Sim %s\n\nSee CHANGELOG.md for release details.\n' "$VERSION" > release-metadata/release-notes.md
          fi
      - name: Upload release security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: release-metadata/
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release with signed evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --verify-tag \
            --title "ZeroTrust-FL-Sim ${VERSION}" \
            --notes-file "release-metadata/release-notes.md" \
            "release-metadata/ZeroTrust-FL-Sim-${VERSION}-source.tar.gz" \
            "release-metadata/source.sigstore.json" \
            "release-metadata/source.spdx.json" \
            "release-metadata/coordinator.spdx.json" \
            "release-metadata/worker.spdx.json" \
            "release-metadata/recovery.spdx.json" \
            "release-metadata/image-digests.txt" \
            "release-metadata/SHA256SUMS"
