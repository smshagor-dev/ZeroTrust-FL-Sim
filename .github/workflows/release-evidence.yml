name: Release Evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported-profile:
    name: Kubernetes E2E and reproducible benchmark evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for Kind
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install pinned Kind
        run: go install sigs.k8s.io/kind@v0.27.0
      - name: Verify Kubernetes toolchain
        run: |
          docker version
          kind version
          kubectl version --client
          helm version --short
      - name: Run supported-profile evidence
        env:
          ZTFL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/run_kubernetes_e2e.sh
      - name: Upload Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kubernetes-e2e-${{ github.run_id }}
          path: .k8s-e2e/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-benchmark-${{ github.run_id }}
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 14
