name: CYSE-01608 NSL-KDD external dataset validation

on:
  push:
    branches:
      - research/cyse-01608-reproducibility
    paths:
      - "research/cyse_01608/nsl_*.py"
      - "research/cyse_01608/tests/test_nsl_data.py"
      - ".github/workflows/cyse-nsl-kdd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsl-heldout:
    name: NSL-KDD historical published-split FL experiment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned experiment code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned study dependencies
        run: python -m pip install -r research/cyse_01608/requirements.txt
      - name: Run loader and simulation tests using synthetic fixtures only
        run: python -m pytest -q research/cyse_01608/tests/test_nsl_data.py
      - name: Download standard KDDTrain+ KDDTest+ from a pinned public mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/nsl_kdd
          base="https://raw.githubusercontent.com/Jehuty4949/NSL_KDD/27bbbdf5c5cccf9970b8b6037a0f19dc09c5a0a9"
          curl -fL --retry 3 --connect-timeout 30 -o data/nsl_kdd/KDDTrain+.txt "$base/KDDTrain%2B.txt"
          curl -fL --retry 3 --connect-timeout 30 -o data/nsl_kdd/KDDTest+.txt "$base/KDDTest%2B.txt"
      - name: Verify mirror blobs and expected historical train/test row counts
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "research/cyse_01608")
          from nsl_data import EXPECTED_GIT_BLOBS, verify_file, _read, TRAIN_ROWS, TEST_ROWS
          root=Path("data/nsl_kdd")
          for label, filename, count in (("train","KDDTrain+.txt",TRAIN_ROWS),("test","KDDTest+.txt",TEST_ROWS)):
              path=root/filename
              meta=verify_file(path, EXPECTED_GIT_BLOBS[label])
              assert len(_read(path)) == count
              print(label,count,meta["sha256"],meta["size_bytes"])
          PY
      - name: Execute 5-seed historical NSL-KDD comparison
        run: |
          python research/cyse_01608/nsl_experiment.py \
            --train data/nsl_kdd/KDDTrain+.txt \
            --test data/nsl_kdd/KDDTest+.txt \
            --output artifacts/cyse_01608_nsl_kdd \
            --seeds 0 1 2 3 4 \
            --aggregators mean multi_krum \
            --privacy-modes clip_only dp_1 \
            --attacker-compliance compliant bypass \
            --attacks sign_flip \
            --rounds 20 \
            --malicious-clients 3 \
            --partition dirichlet --alpha 0.3 \
            --train-limit 6000 --test-limit 3000
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path("artifacts/cyse_01608_nsl_kdd")
          manifest=json.loads((root/"nsl_manifest.json").read_text())
          assert manifest["federated_executions"]==80
          assert manifest["federated_rounds"]==1600
          assert all(m["sampled_train"]==6000 and m["sampled_test"]==3000
                     for m in manifest["dataset_manifests"])
          with (root/"nsl_runs.csv").open(newline="") as f: runs=list(csv.DictReader(f))
          with (root/"nsl_paired.csv").open(newline="") as f: paired=list(csv.DictReader(f))
          assert len(runs)==80 and len(paired)==40
          assert all(0<=float(x["macro_f1"])<=1 for x in runs)
          print("NSL-KDD real source, 80 runs / 1600 rounds, verified")
          PY
      - name: Upload results and manifests only, not dataset
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyse-01608-nsl-kdd-reproducibility
          path: artifacts/cyse_01608_nsl_kdd/
          if-no-files-found: ignore
          retention-days: 30
