name: Deployment Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm and Kubernetes production render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify deployment toolchain
        run: |
          helm version --short
          kubectl version --client
      - name: Install YAML validator dependency
        run: python -m pip install 'PyYAML>=6.0,<7.0'
      - name: Lint and render production chart
        run: |
          set -euo pipefail
          VALUES=deploy/helm/zerotrust-fl/values-ci.yaml
          helm lint deploy/helm/zerotrust-fl -f "$VALUES"
          helm template ztfl deploy/helm/zerotrust-fl -f "$VALUES" > /tmp/ztfl-rendered.yaml
      - name: Enforce production render invariants
        run: python scripts/validate_k8s_render.py /tmp/ztfl-rendered.yaml
