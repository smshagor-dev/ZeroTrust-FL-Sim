name: Security Review Bundle

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Full lowercase 40-character commit SHA to package; leave empty for the selected ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: security-review-bundle-${{ github.repository }}-${{ inputs.reviewed_commit || github.sha }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build deterministic reviewer handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve reviewed commit
        id: baseline
        env:
          REQUESTED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          commit="${REQUESTED_COMMIT:-$GITHUB_SHA}"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_commit must be a full lowercase 40-character SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'short=%s\n' "${commit:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checked-out baseline
        env:
          REVIEWED_COMMIT: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$REVIEWED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Build deterministic security-review bundle
        env:
          REVIEWED_COMMIT: ${{ steps.baseline.outputs.sha }}
          BUNDLE_DIR: ${{ runner.temp }}/ztfl-security-review-bundle
          BUNDLE_ARCHIVE: ${{ runner.temp }}/ztfl-security-review-bundle.tar.gz
        run: |
          set -euo pipefail
          python scripts/prepare_security_review_bundle.py \
            --root "$GITHUB_WORKSPACE" \
            --output-dir "$BUNDLE_DIR" \
            --archive "$BUNDLE_ARCHIVE" \
            --commit "$REVIEWED_COMMIT"
          sha256sum "$BUNDLE_ARCHIVE" > "${BUNDLE_ARCHIVE}.sha256"
          tar -tzf "$BUNDLE_ARCHIVE" | grep -Fx 'REVIEW_BASELINE.json'
          tar -tzf "$BUNDLE_ARCHIVE" | grep -Fx 'REVIEW_REPORT_TEMPLATE.md'
          tar -tzf "$BUNDLE_ARCHIVE" | grep -Fx 'SHA256SUMS'

      - name: Upload reviewer handoff artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-review-bundle-${{ steps.baseline.outputs.short }}
          path: |
            ${{ runner.temp }}/ztfl-security-review-bundle/
            ${{ runner.temp }}/ztfl-security-review-bundle.tar.gz
            ${{ runner.temp }}/ztfl-security-review-bundle.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
