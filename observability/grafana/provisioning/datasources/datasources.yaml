apiVersion: 1

datasources:
  - name: Prometheus
    uid: ztfl-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: ztfl-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: ztfl-prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
          - key: service.instance.id
            value: instance
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: ztfl-prometheus
