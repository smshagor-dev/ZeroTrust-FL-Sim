name: zerotrust-fl-sim

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: docker/Dockerfile.worker
  restart: unless-stopped
  depends_on:
    coordinator:
      condition: service_healthy
  networks:
    - control-plane
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/ztfl-worker.ready && kill -0 1"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

x-worker-privacy: &worker-privacy
  ZTFL_DP_ENABLED: ${ZTFL_DP_ENABLED:-false}
  ZTFL_DP_CLIP_NORM: ${ZTFL_DP_CLIP_NORM:-1.0}
  ZTFL_DP_NOISE_MULTIPLIER: ${ZTFL_DP_NOISE_MULTIPLIER:-1.0}
  ZTFL_DP_DELTA: ${ZTFL_DP_DELTA:-1e-5}
  ZTFL_DP_ADJACENCY: ${ZTFL_DP_ADJACENCY:-replace}

services:
  certgen:
    build:
      context: .
      dockerfile: docker/Dockerfile.coordinator
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/generate-dev-pki.sh"]
    environment:
      ZTFL_CERTIFICATE_ALGORITHM: ${ZTFL_CERTIFICATE_ALGORITHM:-ed25519}
      ZTFL_SERVER_NAME: coordinator
      ZTFL_TRUST_DOMAIN: zerotrust-fl.local
      ZTFL_TOKEN_ISSUER: zerotrust-fl-sim
      ZTFL_TOKEN_AUDIENCE: zerotrust-fl-services
      ZTFL_TOKEN_TTL: 24h
    volumes:
      - coordinator_creds:/out/coordinator
      - benign_worker_1_creds:/out/benign-worker-1
      - benign_worker_2_creds:/out/benign-worker-2
      - benign_worker_3_creds:/out/benign-worker-3
      - malicious_worker_1_creds:/out/malicious-worker-1
    restart: "no"
    networks:
      - control-plane

  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.coordinator
    restart: unless-stopped
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      ZTFL_LISTEN_ADDRESS: 0.0.0.0:50051
      ZTFL_SERVER_CERT: /certs/server.crt
      ZTFL_SERVER_KEY: /certs/server.key
      ZTFL_CLIENT_CA: /certs/ca.crt
      ZTFL_JWT_PUBLIC_KEY: /certs/jwt_signing_public.pem
      ZTFL_TRUST_DOMAIN: zerotrust-fl.local
      ZTFL_TOKEN_ISSUER: zerotrust-fl-sim
      ZTFL_TOKEN_AUDIENCE: zerotrust-fl-services
      ZTFL_REGISTRATION_LEASE: 5m
      ZTFL_MAX_MESSAGE_BYTES: "8388608"
      ZTFL_MIN_UPDATES: ${ZTFL_MIN_UPDATES:-3}
      ZTFL_MAX_UPDATES_PER_MINUTE: ${ZTFL_MAX_UPDATES_PER_MINUTE:-12}
      ZTFL_PQC_MODE: ${ZTFL_PQC_MODE:-prefer}
      ZTFL_PQC_REQUIRE_IDENTITY: ${ZTFL_PQC_REQUIRE_IDENTITY:-false}
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - coordinator_creds:/certs:ro
    networks:
      - control-plane
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          TOKEN=$$(cat /certs/health-probe.jwt);
          /usr/local/bin/grpc_health_probe
          -addr=127.0.0.1:50051
          -tls
          -tls-ca-cert=/certs/ca.crt
          -tls-client-cert=/certs/health-probe.crt
          -tls-client-key=/certs/health-probe.key
          -tls-server-name=coordinator
          -rpc-header="authorization: Bearer $$TOKEN"
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s

  benign-worker-1:
    <<: *worker-common
    environment:
      <<: *worker-privacy
      ZTFL_NODE_ID: benign-worker-1
      ZTFL_ATTACK: none
      ZTFL_WORKER_SEED: "101"
    volumes:
      - benign_worker_1_creds:/certs:ro
      - ./benchmarks/results:/app/benchmarks/results

  benign-worker-2:
    <<: *worker-common
    environment:
      <<: *worker-privacy
      ZTFL_NODE_ID: benign-worker-2
      ZTFL_ATTACK: none
      ZTFL_WORKER_SEED: "202"
    volumes:
      - benign_worker_2_creds:/certs:ro
      - ./benchmarks/results:/app/benchmarks/results

  benign-worker-3:
    <<: *worker-common
    environment:
      <<: *worker-privacy
      ZTFL_NODE_ID: benign-worker-3
      ZTFL_ATTACK: none
      ZTFL_WORKER_SEED: "303"
    volumes:
      - benign_worker_3_creds:/certs:ro
      - ./benchmarks/results:/app/benchmarks/results

  malicious-worker-1:
    <<: *worker-common
    environment:
      <<: *worker-privacy
      ZTFL_NODE_ID: malicious-worker-1
      ZTFL_ATTACK: ${ZTFL_MALICIOUS_ATTACK:-gaussian}
      ZTFL_WORKER_SEED: "404"
    volumes:
      - malicious_worker_1_creds:/certs:ro
      - ./benchmarks/results:/app/benchmarks/results

volumes:
  coordinator_creds:
  benign_worker_1_creds:
  benign_worker_2_creds:
  benign_worker_3_creds:
  malicious_worker_1_creds:

networks:
  control-plane:
    driver: bridge
    internal: true
